services:
  worker:
    build:
      context: .
      args:
        WITH_NVIDIA_VAD: "1"
    environment:
      NVIDIA_VAD_PYTHON: /usr/local/bin/python
      NVIDIA_VAD_MODEL: /opt/models/vad_multilingual_marblenet.nemo
      NVIDIA_VAD_DEVICE: ${NVIDIA_VAD_DEVICE:-cpu}
      NVIDIA_VAD_BATCH_SIZE: ${NVIDIA_VAD_BATCH_SIZE:-64}
