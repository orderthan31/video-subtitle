name: Frontend conventions and tests
on:
  push:
    branches: [master]
    paths: ["apps/web/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
