services:
  api:
    build: .
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    restart: unless-stopped
    environment: &storage
      VIDEO_STORAGE_ROOT: /data/video-jobs
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10737418240}
      VIDEO_SERVICE_QUOTA_BYTES: ${VIDEO_SERVICE_QUOTA_BYTES:-322122547200}
      MIN_FREE_SPACE_BYTES: ${MIN_FREE_SPACE_BYTES:-53687091200}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      WEB_CORS_ORIGINS: ${WEB_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - jobs:/data/video-jobs
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  worker:
    build: .
    logging: *bounded-logs
    init: true
    restart: unless-stopped
    command: ["python", "-m", "media_worker.worker"]
    stop_grace_period: 60s
    environment:
      <<: *storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in the root .env}
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-3.8-flash}
      GEMINI_TRANSLATION_MODEL: ${GEMINI_TRANSLATION_MODEL:-gemini-3.8-flash}
      GEMINI_AUDIO_FILTER_MODEL: ${GEMINI_AUDIO_FILTER_MODEL:-gemini-3.8-flash}
      VOCALIZATION_FILTER_ENABLED: ${VOCALIZATION_FILTER_ENABLED:-false}
      MAX_PROCESS_LOG_BYTES: ${MAX_PROCESS_LOG_BYTES:-8388608}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-hevc_nvenc}
      ALLOW_SOFTWARE_ENCODER_FALLBACK: ${ALLOW_SOFTWARE_ENCODER_FALLBACK:-true}
      RESULT_TTL_HOURS: ${RESULT_TTL_HOURS:-24}
      HISTORY_TTL_DAYS: ${HISTORY_TTL_DAYS:-90}
      REVIEW_TTL_HOURS: ${REVIEW_TTL_HOURS:-24}
      UPLOAD_TTL_HOURS: ${UPLOAD_TTL_HOURS:-6}
      ORPHAN_GRACE_HOURS: ${ORPHAN_GRACE_HOURS:-2}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      MAX_ENCODING_JOBS: ${MAX_ENCODING_JOBS:-1}
    volumes:
      - jobs:/data/video-jobs
    depends_on:
      api:
        condition: service_healthy
  web:
    logging: *bounded-logs
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  jobs:
